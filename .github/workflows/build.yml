name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build PwGen.exe
        run: npm run build

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: PwGen-windows
          path: dist/PwGen-win32-x64
