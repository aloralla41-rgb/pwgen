<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pwgen</title>
<style>
  :root{
    --bg:#0d0f12;
    --panel:#15181c;
    --border:#26292f;
    --text:#e4e6eb;
    --muted:#7d838f;
    --accent:#4f9dff;
    --accent-dim:#2c6cc4;
    --mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:480px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px;
  }
  h1{
    font-size:14px;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--muted);
    text-transform:uppercase;
    margin:0 0 20px 0;
  }
  .output{
    display:flex;
    align-items:center;
    background:#0a0c0f;
    border:1px solid var(--border);
    border-radius:6px;
    padding:14px 12px;
    margin-bottom:8px;
    min-height:24px;
  }
  #password{
    flex:1;
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0.5px;
    color:var(--text);
    word-break:break-all;
    user-select:all;
  }
  #password.placeholder{ color:var(--muted); }
  .copy-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:12px;
    font-family:var(--mono);
    padding:4px 8px;
    margin-left:8px;
    border-radius:4px;
    flex-shrink:0;
  }
  .copy-btn:hover{ color:var(--text); background:var(--border); }

  .strength{
    font-size:11px;
    color:var(--muted);
    margin-bottom:20px;
    min-height:14px;
  }
  .strength .bar{
    display:inline-block;
    width:60px;
    height:4px;
    border-radius:2px;
    background:var(--border);
    margin-left:8px;
    position:relative;
    top:-1px;
    overflow:hidden;
  }
  .strength .bar-fill{
    height:100%;
    background:var(--accent);
    transition:width .2s ease;
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-size:13px;
    color:var(--text);
  }
  .row.length-row{
    margin-bottom:20px;
  }
  input[type="range"]{
    -webkit-appearance:none;
    width:60%;
    height:2px;
    background:var(--border);
    border-radius:2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--accent);
    border:none;
    cursor:pointer;
  }
  .len-value{
    color:var(--accent);
    font-weight:600;
    width:28px;
    text-align:right;
  }

  .toggles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
    margin-bottom:24px;
  }
  .toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--text);
  }
  .switch{
    position:relative;
    width:32px;
    height:18px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;
    width:0;
    height:0;
  }
  .slider{
    position:absolute;
    cursor:pointer;
    inset:0;
    background:var(--border);
    border-radius:999px;
    transition:.15s;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:14px;
    width:14px;
    left:2px;
    top:2px;
    background:var(--muted);
    border-radius:50%;
    transition:.15s;
  }
  input:checked + .slider{ background:var(--accent-dim); }
  input:checked + .slider:before{ background:var(--accent); transform:translateX(14px); }
  input:disabled + .slider{ opacity:0.4; cursor:not-allowed; }

  .generate{
    width:100%;
    padding:13px;
    background:var(--accent);
    color:#0a0c0f;
    border:none;
    border-radius:6px;
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .15s;
  }
  .generate:hover{ background:#6bacff; }
  .generate:active{ transform:scale(0.99); }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:12px;
    padding:8px 14px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="card">
  <h1>Password Generator</h1>

  <div class="output">
    <span id="password" class="placeholder">Click generate</span>
    <button class="copy-btn" id="copyBtn">copy</button>
  </div>
  <div class="strength" id="strength"></div>

  <div class="row length-row">
    <label for="length">Length</label>
    <input type="range" id="length" min="4" max="128" value="20">
    <span class="len-value" id="lenValue">20</span>
  </div>

  <div class="toggles">
    <div class="toggle">
      <span>Uppercase A-Z</span>
      <label class="switch">
        <input type="checkbox" id="opt-upper" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle">
      <span>Lowercase a-z</span>
      <label class="switch">
        <input type="checkbox" id="opt-lower" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle">
      <span>Numbers 0-9</span>
      <label class="switch">
        <input type="checkbox" id="opt-numbers" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle">
      <span>Symbols !@#$</span>
      <label class="switch">
        <input type="checkbox" id="opt-symbols" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle">
      <span>Exclude ambiguous</span>
      <label class="switch">
        <input type="checkbox" id="opt-ambiguous">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="generate" id="generateBtn">Generate</button>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
(function(){
  const SETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    numbers: "0123456789",
    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?/~`"
  };
  const AMBIGUOUS = /[Il1O0o]/g;

  const lengthEl = document.getElementById('length');
  const lenValueEl = document.getElementById('lenValue');
  const passwordEl = document.getElementById('password');
  const strengthEl = document.getElementById('strength');
  const generateBtn = document.getElementById('generateBtn');
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');

  const opts = {
    upper: document.getElementById('opt-upper'),
    lower: document.getElementById('opt-lower'),
    numbers: document.getElementById('opt-numbers'),
    symbols: document.getElementById('opt-symbols'),
    ambiguous: document.getElementById('opt-ambiguous')
  };

  lengthEl.addEventListener('input', () => {
    lenValueEl.textContent = lengthEl.value;
  });

  function secureRandomInt(max){
    const arr = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / max) * max;
    let val;
    do { crypto.getRandomValues(arr); val = arr[0]; } while (val >= limit);
    return val % max;
  }

  function buildCharset(){
    let charset = "";
    const active = [];
    if (opts.upper.checked){ active.push('upper'); charset += SETS.upper; }
    if (opts.lower.checked){ active.push('lower'); charset += SETS.lower; }
    if (opts.numbers.checked){ active.push('numbers'); charset += SETS.numbers; }
    if (opts.symbols.checked){ active.push('symbols'); charset += SETS.symbols; }

    if (opts.ambiguous.checked){
      charset = charset.replace(AMBIGUOUS, "");
    }
    return { charset, active };
  }

  function generatePassword(){
    const length = parseInt(lengthEl.value, 10);
    const { charset, active } = buildCharset();

    if (!charset || active.length === 0){
      alert("Select at least one character set.");
      return null;
    }

    let password;
    let attempts = 0;
    do {
      const chars = [];
      for (let i = 0; i < length; i++){
        chars.push(charset[secureRandomInt(charset.length)]);
      }
      password = chars.join('');
      attempts++;
    } while (attempts < 10 && !satisfiesAllSets(password, active));

    return password;
  }

  function satisfiesAllSets(password, active){
    return active.every(key => {
      let set = SETS[key];
      if (opts.ambiguous.checked) set = set.replace(AMBIGUOUS, "");
      for (const ch of password){
        if (set.includes(ch)) return true;
      }
      return false;
    });
  }

  function estimateEntropy(password, active){
    let poolSize = 0;
    if (active.includes('upper')) poolSize += 26;
    if (active.includes('lower')) poolSize += 26;
    if (active.includes('numbers')) poolSize += 10;
    if (active.includes('symbols')) poolSize += SETS.symbols.length;
    const bits = password.length * Math.log2(poolSize || 1);
    return bits;
  }

  function renderStrength(password, active){
    const bits = estimateEntropy(password, active);
    let label, pct;
    if (bits < 40){ label = "Weak"; pct = 25; }
    else if (bits < 60){ label = "Fair"; pct = 50; }
    else if (bits < 80){ label = "Strong"; pct = 75; }
    else { label = "Very strong"; pct = 100; }

    strengthEl.innerHTML =
      `~${Math.round(bits)} bits · ${label}` +
      `<span class="bar"><span class="bar-fill" style="width:${pct}%"></span></span>`;
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  generateBtn.addEventListener('click', () => {
    const { active } = buildCharset();
    const password = generatePassword();
    if (!password) return;
    passwordEl.textContent = password;
    passwordEl.classList.remove('placeholder');
    renderStrength(password, active);
  });

  copyBtn.addEventListener('click', async () => {
    const text = passwordEl.textContent;
    if (!text || passwordEl.classList.contains('placeholder')) return;
    try {
      await navigator.clipboard.writeText(text);
      showToast("Copied to clipboard");
    } catch (e) {
      showToast("Copy failed");
    }
  });

  // guard: ensure at least one charset toggle stays on
  Object.values(opts).slice(0,4).forEach(cb => {
    cb.addEventListener('change', () => {
      const anyOn = [opts.upper, opts.lower, opts.numbers, opts.symbols].some(c => c.checked);
      if (!anyOn){
        cb.checked = true;
      }
    });
  });

  // generate one on load
  generateBtn.click();
})();
</script>

</body>
</html>
